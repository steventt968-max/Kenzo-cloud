
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kenzo Cloud</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 22px;
  background: #090d18;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: #62a8ff;
  font-size: 23px;
  font-weight: bold;
}

.status {
  background: #302b1c;
  color: #ffca65;
  padding: 8px 12px;
  border-radius: 20px;
  font-size: 12px;
}

.card {
  margin-top: 28px;
  padding: 22px;
  border: 1px solid #26344d;
  background: #111a2b;
  border-radius: 18px;
}

h1 {
  font-size: 27px;
}

p {
  color: #9eabc0;
  line-height: 1.6;
}

.info {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 13px 0;
  border-bottom: 1px solid #29364b;
}

button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #347ee8;
  color: white;
  font-size: 16px;
  font-weight: bold;
  margin-top: 18px;
}

button:disabled {
  background: #344258;
  color: #aab5c5;
}

.footer {
  font-size: 12px;
  text-align: center;
  margin-top: 20px;
}
</style>
</head>

<body>

<header>
  <div class="logo">☁ KENZO CLOUD</div>
  <div class="status" id="status">OFFLINE</div>
</header>

<div class="card">

  <h1>Virtual Android</h1>

  <p>
    Cloud Android pribadi untuk mengakses
    perangkat virtual dari HP kamu.
  </p>

  <div class="info">
    <span>Device</span>
    <b>Kenzo-01</b>
  </div>

  <div class="info">
    <span>Server</span>
    <b id="server">Belum tersedia</b>
  </div>

  <div class="info">
    <span>Runtime</span>
    <b id="runtime">Belum berjalan</b>
  </div>

  <button id="connect" disabled>
    Server belum tersedia
  </button>

  <div class="footer">
    Kenzo Cloud • Version 0.1
  </div>

</div>

</body>
</html>
